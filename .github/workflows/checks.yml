name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod

jobs:
  build:
    name: Check and Build Provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum
      - name: Check formatting
        run: ./scripts/gofmtcheck.sh
      - name: Check vendored dependencies
        run: |
          go mod tidy
          go mod vendor
          git diff --exit-code
      - name: Build
        run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2

  generate:
    name: Check Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.8.*'
          terraform_wrapper: false
      - name: Generate provider code and documentation
        run: go generate ./...
      - name: Check generated code for differences
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected differences after code generation. Run 'go generate ./...' and commit the result."; exit 1)

  goreleaser:
    name: Dry-Run GoReleaser Check
    needs: [build, generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum
      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.17.1
          args: release --skip=publish,sign --snapshot --clean

  acceptance:
    name: Acceptance Tests (Terraform ${{ matrix.terraform }})
    if: github.repository_owner == 'CiscoDevNet' && github.event_name == 'push'
    needs: [build, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: tf-hyperfabric-ci-test
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - '1.8.*'
          - '1.14.*'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Run Terraform acceptance tests
        run: go test ./internal/provider -v -race -timeout 290m -coverprofile=coverage.out -covermode=atomic
        env:
          HYPERFABRIC_TOKEN: ${{ secrets.HYPERFABRIC_TOKEN }}
          TF_ACC: '1'
          TF_ACC_HYPERFABRIC_DEVICE_ID: ${{ secrets.TF_ACC_HYPERFABRIC_DEVICE_ID }}
          TF_ACC_STATE_LINEAGE: '1'
      - name: Upload coverage to Codecov
        if: matrix.terraform == '1.14.*'
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
